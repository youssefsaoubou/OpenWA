name: Refresh dashboard security lockfile
on:
  push:
    branches:
      - fix/dashboard-source-map-security-20261014
    paths:
      - .github/workflows/refresh-dashboard-lockfile.yml
permissions:
  contents: write
jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/dashboard-source-map-security-20261014
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Update lockfile and verify audit
        run: |
          cd dashboard
          npm install --package-lock-only --ignore-scripts --no-audit --no-fund
          npm ci --ignore-scripts --no-audit --no-fund
          npm audit --audit-level=high
      - name: Commit lockfile
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add dashboard/package-lock.json
          if ! git diff --cached --quiet; then
            git commit -m 'fix(security): refresh dashboard lockfile for source-map-js'
            git push origin HEAD:fix/dashboard-source-map-security-20261014
          fi
